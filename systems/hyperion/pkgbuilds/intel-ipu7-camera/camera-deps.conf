# Blacklist ov08x40 - it must load AFTER intel_cvs acquires camera ownership
blacklist ov08x40

# Blacklist intel_cvs - it claims the "wake" GPIO that the CS35L57 speaker amps
# read their speaker ID from, so camera-init loads it once the sound card is up
blacklist intel_cvs

# Soft dependency: if ov08x40 is loaded, ensure intel_cvs loads first
softdep ov08x40 pre: intel_cvs
