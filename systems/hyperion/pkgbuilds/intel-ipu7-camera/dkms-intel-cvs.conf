# Linux 7.2+ Intel CVS CSI-2 bridge, taken unchanged from the v7.2 kernel tree
# (drivers/media/i2c/cvs). Kernels that build it in-tree (linux-omarchy) do not
# need this; linux-cachyos 7.2 ships the Kconfig entry with it disabled.
# LLVM=1: the CachyOS kernel is a clang + ThinLTO build.
PACKAGE_NAME="intel-cvs"
PACKAGE_VERSION="@PKGVER@"
AUTOINSTALL="yes"

# 7.2 and later only (regex, so the pacman dkms hook also honours it)
BUILD_EXCLUSIVE_KERNEL="^(7\.([2-9]|[1-9][0-9])|[89]|[1-9][0-9])\."

BUILT_MODULE_NAME[0]="intel_cvs"
BUILT_MODULE_LOCATION[0]=""
DEST_MODULE_LOCATION[0]="/updates"

MAKE[0]="make LLVM=1 KERNEL_SRC=${kernel_source_dir}"
CLEAN="make LLVM=1 KERNEL_SRC=${kernel_source_dir} clean"
