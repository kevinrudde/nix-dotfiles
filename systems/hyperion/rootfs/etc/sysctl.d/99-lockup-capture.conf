# Turn a detected lockup into a panic, so it gets captured instead of just
# printed to a screen nobody can scroll on a machine that cannot write to disk.
#
# Dropping `nowatchdog` from the cmdline (see /etc/default/limine) is necessary
# but not sufficient: it restores the master switch and the soft-lockup
# detector, and then /usr/lib/sysctl.d/70-cachyos-settings.conf turns the NMI
# hard-lockup detector straight back off again. Re-asserting it here is the
# whole point of the exercise, because the NMI detector is the only one that
# can still fire on a CPU that has stopped taking timer interrupts -- the
# actual failure mode on this host. This file sorts after 70-, so it wins.
#
# Verify after a reboot: kernel.nmi_watchdog must read 1, not just
# kernel.watchdog. dmesg should also say "NMI watchdog: Enabled".
kernel.nmi_watchdog = 1

# This kernel is built without CONFIG_BOOTPARAM_HARDLOCKUP_PANIC, so panicking
# on detection has to be asked for explicitly -- and panic is what triggers the
# pstore write to EFI NVRAM that survives the power cut.
kernel.hardlockup_panic = 1
kernel.softlockup_panic = 1

# Reboot 20s after panicking rather than sitting on the panic screen forever.
# Long enough to photograph the trace drm_panic draws, short enough that the
# machine comes back on its own with the dump already in NVRAM.
kernel.panic = 20

# Deliberately NOT setting panic_on_oops: an oops the machine survives already
# lands in the journal, so turning those into reboots would cost us information
# rather than gain any. Only the silent hangs need this treatment.
