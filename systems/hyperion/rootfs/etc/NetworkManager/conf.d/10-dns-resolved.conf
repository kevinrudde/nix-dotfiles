# Pin NetworkManager to systemd-resolved and keep it out of
# /etc/resolv.conf. apply-system-state.sh points that file at resolved's
# stub; with the default rc-manager=symlink NetworkManager finds a regular
# file there and writes it itself, and the search list it writes only
# covers NM connections -- it drops the domains tailscaled programs onto
# the tailscale0 link, so bare-hostname MagicDNS lookups never get the
# tailnet suffix appended. See https://tailscale.com/s/resolved-nm.
[main]
dns=systemd-resolved
rc-manager=unmanaged
