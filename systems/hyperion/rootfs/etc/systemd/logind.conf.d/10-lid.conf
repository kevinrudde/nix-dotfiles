# macOS-style lid policy. These happen to be systemd's own defaults today; they
# are pinned here because the rest of the lid behaviour is built on top of them
# and reads as broken if a distro drop-in ever moves them.
#
# Undocked, on battery or on AC, the lid closes into a suspend -- hypridle's
# before_sleep_cmd locks first, so it always opens onto a password prompt.
# Docked (logind counts a second connected display as docked) it stays awake for
# clamshell use, and systems/shared/hypr/conf/lid.lua drops the built-in panel
# out of the layout for as long as the lid is shut.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
