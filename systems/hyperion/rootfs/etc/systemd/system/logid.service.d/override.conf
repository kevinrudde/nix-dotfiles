[Unit]
# Start-limit tuning belongs in [Unit]; systemd ignores StartLimit* keys in
# [Service] ("Unknown key name ... ignoring") and falls back to the defaults
# of 5 starts / 10s, which a boot-time crash-loop exhausts in ~8s with
# RestartSec=2 below, leaving the unit failed until manually restarted.
StartLimitIntervalSec=120
StartLimitBurst=20

[Service]
Restart=on-failure
RestartSec=2
