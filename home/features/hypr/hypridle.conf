general {
  lock_cmd = pidof hyprlock || hyprlock --immediate-render
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
}

# Fade the backlight down just before the lock lands, the way macOS dims ahead
# of sleeping the display. on-resume restores the saved level, so the keystroke
# that wakes the lock screen also brings the brightness back.
listener {
  timeout = 280
  on-timeout = brightnessctl -s set 10%
  on-resume = brightnessctl -r
}

listener {
  timeout = 300
  on-timeout = loginctl lock-session
}

# Screen-off is driven by inactivity *while locked* rather than by an absolute
# idle deadline, so it lands the same 10s after a manual MOD5+L, after the lid
# closes and after the 300s auto-lock above. hypridle keeps getting
# ext-idle-notify events once hyprlock has grabbed the seat, so typing a
# password resets the timer and the panel never dies mid-entry.
#
# condition_cmd is what keeps the short rule from blanking an unlocked session:
# no hyprlock, no dpms off, and with no condition_retry it simply waits for the
# next idle cycle instead of hammering away during an ordinary coffee break.
#
# Two rules, one behaviour: the 10s one covers locks that reset the idle timer
# on their way in (a keybind, a resume), the 310s one covers the auto-lock,
# which fires mid-idle and so never re-arms the short rule.
#
# Neither has an on-resume. Turning the panel back on is left to
# misc:key_press_enables_dpms, so that mouse movement alone will not do it.
listener {
  timeout = 10
  condition_cmd = pidof hyprlock
  on-timeout = hyprctl dispatch dpms off
}

listener {
  timeout = 310
  condition_cmd = pidof hyprlock
  on-timeout = hyprctl dispatch dpms off
}

# Sleep shortly after the lock lands, wherever that lock came from -- the
# MOD5+L keybind, the lid, or the 300s auto-lock above. A lock is the session
# saying nobody is at the machine, and this is what stops a docked clamshell
# from idling all night with the fan up: the panels go dark at 10s and the
# machine is actually asleep 5s later.
#
# An *unlocked* clamshell is untouched. Lid shut on DP-1 with no hyprlock
# running never trips this, so a long build still keeps its own machine awake,
# and so does anything holding a systemd sleep inhibitor -- systemctl suspend
# declines rather than pulling the rug out mid-job.
#
# Paired the same way as the dpms rules above and for the same reason: the 15s
# rule covers locks that reset the idle timer on their way in, the 315s one
# covers the auto-lock, which fires mid-idle and so never re-arms the short
# rule. before_sleep_cmd locking again on the way down is a no-op here; the
# session is already locked, which is the whole precondition.
listener {
  timeout = 15
  condition_cmd = pidof hyprlock
  on-timeout = systemctl suspend
}

listener {
  timeout = 315
  condition_cmd = pidof hyprlock
  on-timeout = systemctl suspend
}
