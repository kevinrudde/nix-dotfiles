# Dell XPS 16 (2026, SKU 0DBA) internal speaker tuning.
#
# Thirteen biquads and a lookahead limiter, hosted as a PipeWire filter-chain
# in front of the internal speaker sink. The stock Linux path already loads
# Dell's Cirrus smart-amplifier firmware; this adds the perceptual voicing the
# Windows Waves layer provides and Linux does not.
#
# Ported verbatim from omarchy's default/audio/tunings/dell-xps-2026 (MIT),
# which fitted this chain to the measured response of the xps-audio-linux
# EasyEffects profile (MIT, spencerbull) under a pink-weighted 104-tone
# multitone, then measured the fit: 1.24 dB RMS against that reference, 13.2 ms
# bass group-delay swing, 1.6 dB limiter headroom. Fitted and measured on the
# XPS 14 (SKU 0DB9); the XPS 16 shares the speaker hardware Dell keys on the
# SKU pair, and omarchy ships this profile for both, but nobody has measured it
# on a 16. Treat the numbers as descriptive of the 14.
#
# Q below 200 Hz is capped at 1.8 upstream on purpose: a closer magnitude fit is
# possible with high-Q sections, but the reference produces its narrow bass
# features by convolution, and reproducing those with high-Q biquads swung group
# delay 31 ms across 63-80 Hz, smearing bass transients. The cap costs 0.33 dB.
#
# Unlike upstream this is one self-contained config rather than a host config
# plus a rendered drop-in: there is no on/off command to switch tunings here, the
# graph is generated by home-manager, and the target sink is a constant on this
# machine. Everything above `context.modules` is the minimum a filter-hosting
# PipeWire client needs, taken from /usr/share/pipewire/filter-chain.conf.
#
# Run as a PipeWire *client* (`pipewire -c xps16-speaker-tuning.conf`) rather
# than loaded into the daemon from pipewire.conf.d: the daemon only reads its own
# config at startup, so a daemon-loaded graph could only be changed by restarting
# PipeWire, which drops every PulseAudio client's connection. Hosting it
# separately also contains failure -- a malformed graph breaks only this service
# instead of stopping PipeWire from starting at all.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    # Boost the audio thread priority.
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }

    # The native communication protocol.
    { name = libpipewire-module-protocol-native }

    # Lets this process provide nodes to PipeWire.
    { name = libpipewire-module-client-node }

    # Wraps nodes in an adapter with a converter and resampler.
    { name = libpipewire-module-adapter }

    # Channels are wired explicitly because the limiter is a stereo plugin; a
    # mono graph is duplicated per channel and would limit each side
    # independently, shifting the stereo image on bass transients.
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Laptop Speakers"
            media.name       = "Laptop Speakers"

            filter.graph = {
                nodes = [
                    { type = builtin name = s0_l  label = bq_highpass  control = { "Freq" = 60.9 "Q" = 1.0 } }
                    { type = builtin name = s1_l  label = bq_highpass  control = { "Freq" = 60.9 "Q" = 1.0 } }
                    { type = builtin name = s2_l  label = bq_peaking   control = { "Freq" = 83.4 "Q" = 1.8 "Gain" = -8.0 } }
                    { type = builtin name = s3_l  label = bq_peaking   control = { "Freq" = 100.4 "Q" = 1.59 "Gain" = 7.47 } }
                    { type = builtin name = s4_l  label = bq_peaking   control = { "Freq" = 250.5 "Q" = 2.966 "Gain" = -4.7 } }
                    { type = builtin name = s5_l  label = bq_peaking   control = { "Freq" = 419.8 "Q" = 3.0 "Gain" = -5.83 } }
                    { type = builtin name = s6_l  label = bq_peaking   control = { "Freq" = 631.3 "Q" = 2.515 "Gain" = -10.33 } }
                    { type = builtin name = s7_l  label = bq_peaking   control = { "Freq" = 894.4 "Q" = 4.0 "Gain" = -2.42 } }
                    { type = builtin name = s8_l  label = bq_peaking   control = { "Freq" = 1355.7 "Q" = 2.884 "Gain" = 6.92 } }
                    { type = builtin name = s9_l  label = bq_peaking   control = { "Freq" = 1707.2 "Q" = 1.311 "Gain" = -6.54 } }
                    { type = builtin name = s10_l label = bq_peaking   control = { "Freq" = 3100.0 "Q" = 0.5 "Gain" = -10.09 } }
                    { type = builtin name = s11_l label = bq_peaking   control = { "Freq" = 3200.0 "Q" = 1.048 "Gain" = 3.09 } }
                    { type = builtin name = s12_l label = bq_highshelf control = { "Freq" = 6015.2 "Q" = 1.5 "Gain" = -1.34 } }

                    { type = builtin name = s0_r  label = bq_highpass  control = { "Freq" = 60.9 "Q" = 1.0 } }
                    { type = builtin name = s1_r  label = bq_highpass  control = { "Freq" = 60.9 "Q" = 1.0 } }
                    { type = builtin name = s2_r  label = bq_peaking   control = { "Freq" = 83.4 "Q" = 1.8 "Gain" = -8.0 } }
                    { type = builtin name = s3_r  label = bq_peaking   control = { "Freq" = 100.4 "Q" = 1.59 "Gain" = 7.47 } }
                    { type = builtin name = s4_r  label = bq_peaking   control = { "Freq" = 250.5 "Q" = 2.966 "Gain" = -4.7 } }
                    { type = builtin name = s5_r  label = bq_peaking   control = { "Freq" = 419.8 "Q" = 3.0 "Gain" = -5.83 } }
                    { type = builtin name = s6_r  label = bq_peaking   control = { "Freq" = 631.3 "Q" = 2.515 "Gain" = -10.33 } }
                    { type = builtin name = s7_r  label = bq_peaking   control = { "Freq" = 894.4 "Q" = 4.0 "Gain" = -2.42 } }
                    { type = builtin name = s8_r  label = bq_peaking   control = { "Freq" = 1355.7 "Q" = 2.884 "Gain" = 6.92 } }
                    { type = builtin name = s9_r  label = bq_peaking   control = { "Freq" = 1707.2 "Q" = 1.311 "Gain" = -6.54 } }
                    { type = builtin name = s10_r label = bq_peaking   control = { "Freq" = 3100.0 "Q" = 0.5 "Gain" = -10.09 } }
                    { type = builtin name = s11_r label = bq_peaking   control = { "Freq" = 3200.0 "Q" = 1.048 "Gain" = 3.09 } }
                    { type = builtin name = s12_r label = bq_highshelf control = { "Freq" = 6015.2 "Q" = 1.5 "Gain" = -1.34 } }

                    { type   = lv2
                      name   = limiter
                      plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                      control = {
                          # Both default to enabled: "alr" regulates level toward
                          # the threshold and "boost" normalises the threshold up
                          # to full scale. A fixed tuning must switch them off or
                          # its tone drifts with programme level.
                          "alr"   = 0
                          "boost" = 0
                          "g_in"  = 0.5456
                          "th"    = 0.891
                      }
                    }
                ]

                links = [
                    { output = "s0_l:Out"  input = "s1_l:In" }
                    { output = "s1_l:Out"  input = "s2_l:In" }
                    { output = "s2_l:Out"  input = "s3_l:In" }
                    { output = "s3_l:Out"  input = "s4_l:In" }
                    { output = "s4_l:Out"  input = "s5_l:In" }
                    { output = "s5_l:Out"  input = "s6_l:In" }
                    { output = "s6_l:Out"  input = "s7_l:In" }
                    { output = "s7_l:Out"  input = "s8_l:In" }
                    { output = "s8_l:Out"  input = "s9_l:In" }
                    { output = "s9_l:Out"  input = "s10_l:In" }
                    { output = "s10_l:Out" input = "s11_l:In" }
                    { output = "s11_l:Out" input = "s12_l:In" }
                    { output = "s12_l:Out" input = "limiter:in_l" }
                    { output = "s0_r:Out"  input = "s1_r:In" }
                    { output = "s1_r:Out"  input = "s2_r:In" }
                    { output = "s2_r:Out"  input = "s3_r:In" }
                    { output = "s3_r:Out"  input = "s4_r:In" }
                    { output = "s4_r:Out"  input = "s5_r:In" }
                    { output = "s5_r:Out"  input = "s6_r:In" }
                    { output = "s6_r:Out"  input = "s7_r:In" }
                    { output = "s7_r:Out"  input = "s8_r:In" }
                    { output = "s8_r:Out"  input = "s9_r:In" }
                    { output = "s9_r:Out"  input = "s10_r:In" }
                    { output = "s10_r:Out" input = "s11_r:In" }
                    { output = "s11_r:Out" input = "s12_r:In" }
                    { output = "s12_r:Out" input = "limiter:in_r" }
                ]

                inputs  = [ "s0_l:In" "s0_r:In" ]
                outputs = [ "limiter:out_l" "limiter:out_r" ]
            }

            audio.channels = 2
            audio.position = [ FL FR ]

            capture.props = {
                node.name   = "xps16_speaker_tuning"
                media.class = Audio/Sink
                # Slotted deliberately between the internal speakers (712) and
                # the headphone jack (1000), so WirePlumber prefers the tuned
                # sink over the raw one whenever it has to pick the built-in
                # audio -- unplugging a dock must not silently drop the tuning --
                # while headphones, USB and Bluetooth still take over as before.
                priority.session = 730
            }
            playback.props = {
                node.name     = "xps16_speaker_tuning_output"
                node.passive  = true
                target.object = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Speaker__sink"
                # This stream is the filter's output and is a movable sink input
                # like any other, so anything that reroutes "all streams" to a
                # newly selected output would drag the processing along with it --
                # onto headphones, or into the tuning's own sink, which is a
                # cycle. Pin it.
                node.dont-move = true
                # If the speaker sink is not present yet -- this client can start
                # before the device is discovered -- WirePlumber would otherwise
                # link the output to whatever default exists, quietly tuning the
                # wrong device while the tuning sink still looks healthy. Wait for
                # the named target instead. Both keys are needed: without linger,
                # WirePlumber destroys the node rather than waiting (see its
                # scripts/linking/find-defined-target.lua).
                node.dont-fallback = true
                node.linger = true
            }
        }
    }
]
